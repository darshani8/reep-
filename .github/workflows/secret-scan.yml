name: Secret scan

# THE AUTHORITY FOR "NO SECRET IN THIS REPOSITORY". .gitleaks.toml has had a
# caller since it was written -- the pre-commit hook -- and that caller lives in
# .git/hooks, is not cloned, and is skipped by `git commit --no-verify` without a
# trace. This is the copy meant to be unskippable: the required check
# "Secrets (gitleaks)" in .github/rulesets/{main,stage,dev}.json -- which is
# true only once an admin APPLIES those rulesets. Until then this job runs and
# goes red on every pull request, and nothing stops a merge over the red
# (.github/rulesets/README.md has the command and how to check it took). On a public
# repository a pushed AUTH_SECRET has no un-push, only rotation, which signs
# every live session out -- so the check has to stand in front of the merge,
# not behind it.
#
# WHY A STANDALONE WORKFLOW AND NOT A SIXTH ci.yml JOB. §34 in
# apps/api-py/tests/test_codebase_guards.py pins ci.yml's five job names against
# the rulesets, tools/ci/protect-main.sh and tools/ci/preflight.sh, and
# branch-policy.yml set the precedent for a required check that lives beside
# them. Two reasons it lives here rather than there: ci.yml's `api` job is ten
# minutes of Postgres and pytest, and a leaked key should be red in thirty
# seconds whatever else is broken; and this job needs the WHOLE history
# (fetch-depth: 0), which no ci.yml job wants to pay for. §34 reads this file to
# prove the display name below is the string the rulesets require, so renaming
# the job without them fails the build exactly as a ci.yml rename does.
#
# WHY NOT gitleaks/gitleaks-action. It is a third-party action handed the
# workflow's token, and its own release cadence decides which scanner runs.
# (It also wants a paid licence key for an ORGANISATION-owned repository, which
# this user-owned one is not today -- a reason that would arrive the day the
# repository moves.) The binary below is the same scanner, pinned by version
# AND by sha256, holding no token at all.

on:
  pull_request:
  push:
    branches: [main, stage, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The ci.yml rule: supersede on a pull request, always finish on a branch.
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump these two together, from the release's own checksums file, and bump
  # .pre-commit-config.yaml's `rev` with them: a hook and a gate on different
  # versions disagree about the default ruleset, and the disagreement reads as
  # a flaky scanner.
  GITLEAKS_VERSION: "8.30.0"
  GITLEAKS_SHA256: "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e"

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because a secret added in commit 1 of a pull request and
      # deleted in commit 2 is still pushed, still public, and invisible to a
      # scan of the final tree.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The hash is pinned HERE, not read from the release's checksums file: a
      # checksum fetched from the same place as the binary proves only that the
      # download was not truncated.
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks" version

      # Two scans, both always run, one verdict at the end -- so a leak in the
      # history does not hide whether the tree is clean, and the other way round.
      #
      # HISTORY: on a pull request, exactly the commits it adds (base..head);
      # on a push to a long-lived branch, every commit reachable from it. The
      # full walk is ~20 s, and it avoids the push event's `before` being all
      # zeros on a branch's first push.
      #
      # THE RANGE IS PROVEN BEFORE IT IS SCANNED, because gitleaks FAILS OPEN on
      # one it cannot resolve: given an unknown base it logs `ERR "stderr is not
      # empty"`, scans 0 commits, prints "no leaks found" and exits 0 -- measured
      # with 8.30.0, and a stacked PR whose base was rebased away is exactly that
      # range. So: both ends must be commits in this clone, `git rev-list` is
      # fatal, any ERR line from gitleaks fails the step, and "0 commits
      # scanned" when the range holds commits that add lines fails it too. (Not
      # an exact count: gitleaks skips commits whose diff adds nothing, and
      # matching its count to the commit means re-implementing its walk.)
      #
      # TREE: the checked-out files, which catches a secret in a file whose
      # commit was already scanned under an older ruleset.
      #
      # --ignore-gitleaks-allow everywhere: without it, a `gitleaks:allow` comment
      # on the line silences any finding -- a third allowlist, written by the
      # author of the leak, read by no reviewer, and outside the two this repo
      # sanctions (.gitleaks.toml by value, .gitleaksignore by fingerprint).
      # tools/ci/check_gitleaks_rules.py replays a marked leak, and
      # tests/test_codebase_guards.py refuses an invocation without the flag.
      #
      # --redact everywhere, with --verbose so a red run names the file, line,
      # rule and commit: this log is public, and a scanner that prints what it
      # found has published it a second time. With --redact the Secret and Match
      # fields read REDACTED; tools/ci/check_gitleaks_rules.py proves the rules
      # themselves before either scan runs.
      - name: Prove the rules (replayed leaks must be caught, placeholders quiet)
        run: python3 tools/ci/check_gitleaks_rules.py

      - name: Scan the commits and the tree
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # `set +e`, and not optional. GitHub runs a run: block with no shell:
          # as `bash --noprofile --norc -eo pipefail`, so -e is ON before this
          # line, and `set -uo pipefail` alone left it on: the history scan's
          # exit 1 killed the script before `history=$?`, so the tree was never
          # scanned and no annotation said why (DEF-QG-I01). This step captures
          # every status itself and decides once, at the end; tests/
          # test_secret_scan_workflow.py keeps -e off here.
          set +e -uo pipefail
          # Reports go OUTSIDE the checkout, or the tree scan reads them.
          report="$RUNNER_TEMP/gitleaks-report"
          mkdir -p "$report"
          # A SHALLOW clone is a history scan of whatever happened to be
          # fetched. At depth 1 a push scan read 1 commit and said "no leaks
          # found"; at 50 it read 98 of 746 (DEF-QG-I06). fetch-depth: 0 above
          # prevents it and tests/test_secret_scan_workflow.py pins that line;
          # this refuses if it is ever lost, in BOTH modes -- a PR range that
          # happens to fit inside the fetched depth is right by luck, not design.
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::this checkout is shallow, so the history scan would read only the commits that were fetched. Set fetch-depth: 0 on the checkout step; refusing rather than reporting a partial history as clean."
            exit 1
          fi
          if [ "$EVENT" = "pull_request" ]; then
            for end in "base:$BASE_SHA" "head:$HEAD_SHA"; do
              if ! git cat-file -e "${end#*:}^{commit}" 2>/dev/null; then
                echo "::error::the pull request's ${end%%:*} commit '${end#*:}' is not in this clone, so its commit range cannot be scanned. Refusing rather than scanning nothing: rebase the branch onto its base, or re-run once the base exists."
                exit 1
              fi
            done
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="HEAD"
          fi
          if ! commits="$(git rev-list --no-merges --count "$range")"; then
            echo "::error::git rev-list could not read '$range'; refusing rather than scanning nothing."
            exit 1
          fi
          # Commits that add at least one line -- the only ones gitleaks reads.
          adding="$(git log --no-merges --format='format:@@commit' --numstat "$range" \
            | awk '$0=="@@commit"{c=1;next} c&&NF&&($1!="0"){n++;c=0} END{print n+0}')"
          echo "Range $range: $commits non-merge commit(s), $adding adding lines"

          gitleaks git . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --ignore-gitleaks-allow --log-opts="$range" --redact --verbose --no-banner --exit-code 1 \
            --report-format json --report-path "$report/history.json" 2>&1 | tee "$report/history.log"
          history=$?
          # gitleaks colours its log even off a terminal; strip that before
          # reading it, and match the LEVEL column, not the word anywhere (a
          # verbose finding prints the commit message, which may say "ERR").
          sed -i 's/\x1b\[[0-9;]*m//g' "$report/history.log"
          scanned="$(sed -n 's/.*[^0-9]\([0-9][0-9]*\) commits scanned.*/\1/p' "$report/history.log" | tail -n 1)"
          if grep -Eq '^[0-9]{1,2}:[0-9]{2}(AM|PM) ERR ' "$report/history.log"; then
            echo "::error::gitleaks logged an error during the history scan (above); its 'no leaks found' cannot be trusted."
            history=2
          elif [ -z "$scanned" ]; then
            echo "::error::gitleaks did not report how many commits it scanned; treating the history scan as not run."
            history=2
          elif [ "$scanned" -eq 0 ] && [ "$adding" -gt 0 ]; then
            echo "::error::gitleaks scanned 0 commits of a range holding $adding that add lines; that is a scan of nothing, not a clean scan."
            history=2
          fi

          gitleaks dir . --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore \
            --ignore-gitleaks-allow --redact --verbose --no-banner --exit-code 1 \
            --report-format json --report-path "$report/tree.json" 2>&1 | tee "$report/tree.log"
          tree=$?
          sed -i 's/\x1b\[[0-9;]*m//g' "$report/tree.log"
          if grep -Eq '^[0-9]{1,2}:[0-9]{2}(AM|PM) ERR ' "$report/tree.log"; then
            echo "::error::gitleaks logged an error during the tree scan (above)."
            tree=2
          fi
          # Exit 1 is "found something"; anything else is the scan failing to
          # run, and a scan that did not run is never a pass.
          for result in "history:$history" "tree:$tree"; do
            case "${result#*:}" in
              0) ;;
              1) echo "::error::gitleaks found a secret in the ${result%%:*} scan (file, line and rule above; the value is redacted). Rotate it first -- removing the line does not un-publish it -- then see .gitleaks.toml for how a published dev value is allowlisted." ;;
              *) echo "::error::the ${result%%:*} scan did not complete, so it is not a pass." ;;
            esac
          done
          [ "$history" -eq 0 ] && [ "$tree" -eq 0 ]

      # Redacted (the Secret field reads REDACTED), so the artifact is no more
      # sensitive than the log. Uploaded on failure too, which is when it is read.
      - name: Upload the redacted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: ${{ runner.temp }}/gitleaks-report/
          retention-days: 14
          if-no-files-found: warn
