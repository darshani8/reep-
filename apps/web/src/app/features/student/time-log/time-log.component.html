<div class="panel" data-p="timesheet">
  <div class="dt-header">
    <div>
      <div class="dt-title">Time Sheet</div>
      <div class="dt-sub">Just 5 activities — quick daily fill</div>
    </div>
    <button
      type="button"
      class="dt-btn primary"
      [disabled]="saving() || loading()"
      (click)="save()"
    >
      <span class="icon" style="font-size:15px">save</span>
      {{ saving() ? 'Saving…' : 'Save today' }}
    </button>
  </div>

  @if (error()) {
    <div class="ts-note" role="status">
      <span class="icon" style="font-size:16px">info</span>{{ error() }}
    </div>
  }

  <div class="ts-grid">
    @for (b of buckets; track b.activity) {
      <div class="ts-cell">
        <span class="icon">{{ b.icon }}</span>
        <input
          type="number"
          min="0"
          step="0.5"
          inputmode="decimal"
          [value]="hoursFor(b.activity)"
          [attr.aria-label]="b.label"
          (input)="setHours(b.activity, $event)"
        />
        <small>{{ b.label }}</small>
      </div>
    }
  </div>

  <div class="dt-sub">
    @if (loading()) {
      Loading today’s time sheet…
    } @else {
      Total logged today: {{ totalHours() }} hrs
    }
    @if (saved()) { <span class="ts-saved"> · Saved</span> }
  </div>
</div>
