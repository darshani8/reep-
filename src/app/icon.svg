<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="REEP">
  <!--
    The one hue, at tab size. Ink tile, cream mark — the same pair the app uses
    for a contained button, which is the only place the product puts cream on
    ink. Drawn rather than a letterform in a webfont so it needs no font load
    and stays legible at 16px.
  -->
  <rect width="32" height="32" rx="7" fill="#1c1810" />
  <!-- R: stem, bowl, leg. Stroked, not a glyph, so the weight holds when the
       browser scales this to 16px. -->
  <path
    d="M11 23V9h6.2a4.1 4.1 0 0 1 0 8.2H11m5.1 0L21 23"
    fill="none"
    stroke="#efe9dd"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
