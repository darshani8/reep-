<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>REEP · Student</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ece4f5" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- INSTALLABLE, FOR EVERY ROLE (2026-10-07). `name` is "REEP" and
       `start_url` is "/", which homeRedirectGuard sends to the signed-in
       role's home — so one installed app is the student's, the faculty
       member's and the office's. `id` stays "/student" deliberately: it is
       the app's identity, and changing it would make every phone that already
       installed REEP see a second, different app. The per-screen shortcuts
       went with the student-only name, because a shortcut cannot be per-role
       and a faculty member's "Jobs" would have bounced off a student route. The `scope`
       is "/" and cannot be narrowed: scope is what the installed
       window is allowed to keep — narrow it to /student and every /account and
       /login URL opens in the browser instead, which on a phone means the
       student is signed out of the app they just installed.

       The apple-touch-icon is a SEPARATE line because iOS does not read the
       manifest's icons for "Add to Home Screen"; without it the home screen
       gets a screenshot of the page. It is the one opaque icon of the four —
       iOS composites transparency against black. See tools/icons/. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- iOS reads these and not the manifest's `display`/`name`: without them an
       app added to the home screen opens in a Safari frame with the URL bar. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="REEP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- FONTS ARE SELF-HOSTED. There is deliberately no Google Fonts <link> here:
       the @font-face rules live in src/styles/fonts.scss and the files in
       public/fonts/, generated by tools/fonts/fetch-fonts.sh.

       A third-party font host was a request every student's browser made to
       Google on every cold load, blocked outright on some campus networks — and
       when the icon font is the thing that fails, it takes the UI with it, since
       Material Symbols renders from ligatures and an unloaded face prints the
       literal word "leaderboard" where a glyph should be.

       The three latin faces needed to paint the first frame are preloaded. The icon font
       is NOT preloaded: it is 144 kB and nothing in the first paint depends on
       it (the `.icon` box is clamped and hidden until the face reports itself
       loaded — see main.ts), so preloading it would compete with the text the
       student is actually waiting to read. -->
    <link
      rel="preload"
      href="/fonts/plus-jakarta-sans-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-600-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
