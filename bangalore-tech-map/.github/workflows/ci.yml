name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Build, test and check the dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: dataset.json is exactly what the research slices produce
        run: python3 tools/data/merge.py --check
      - name: Data quality report (informational)
        run: python3 tools/data/qa.py
      - run: npm test -- --watch=false
      - run: npm run build
