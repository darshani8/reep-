<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>REEP Dashboard — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Clickable single-file clone of the REEP Angular frontend.">

<!-- Material Symbols Outlined — the same glyph set apps/web/src/index.html loads.
     If it cannot be reached (offline), main.js collapses the icons to zero width
     rather than letting the ligature names show as raw text. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   REEP Dashboard — single-file clickable prototype
   --------------------------------------------------------------------------
   A faithful clone of apps/web (Angular 22) with no build step and no server.
   Everything is ported from the real source:

     tokens      apps/web/src/styles/reep-theme.scss
     shell       apps/web/src/app/layout/app-shell.component.*
     login       apps/web/src/app/features/login/login.component.*
     screens     apps/web/src/app/features/student/*
     routes      apps/web/src/app/app.routes.ts

   Angular scopes each component's styles to its own view. A single file has no
   such encapsulation, and the screens genuinely collide — .tabs, .tab, .stats,
   .fld, .err, .actions and .note are each defined by three or more components.
   Every screen rule below is therefore prefixed with its [data-screen="…"],
   which reproduces the encapsulation the framework was providing.
   ========================================================================== */

/* --- tokens · light (verbatim from reep-theme.scss) ----------------------- */
:root {
  --reep-primary-main: #1c1810;
  --reep-primary-light: #443c2d;
  --reep-primary-dark: #100d08;
  --reep-primary-contrast: #f8f4ec;

  --reep-secondary-main: #8a5a1e;
  --reep-secondary-light: #a8752f;
  --reep-secondary-dark: #6b4413;
  --reep-secondary-contrast: #f8f4ec;

  --reep-success-main: #8b5f1c;
  --reep-warning-main: #62471f;
  --reep-error-main: #3a301f;
  --reep-info-main: #8a5a1e;

  --reep-bg-default: #efe9dd;
  --reep-bg-paper: #f8f4ec;

  --reep-text-primary: #1c1810;
  --reep-text-secondary: #5a5142;
  --reep-text-disabled: #6d6353;

  --reep-divider: rgba(28, 24, 16, 0.12);
  --reep-action-hover: rgba(28, 24, 16, 0.04);
  --reep-action-selected: rgba(138, 90, 30, 0.10);

  --reep-radius: 8px;
  --reep-radius-control: 7px;
  --reep-radius-chip: 6px;

  --reep-glass-bg: rgba(252, 249, 242, 0.58);
  --reep-glass-solid: #faf7f0;
  --reep-glass-border: rgba(255, 252, 245, 0.75);
  --reep-glass-shadow: 0 10px 34px rgba(58, 48, 31, 0.10);
  --reep-glass-highlight: inset 0 1px 0 rgba(255, 253, 247, 0.9);

  --reep-neu-bg: linear-gradient(145deg, #faf7f0, #eae3d4);
  --reep-neu-flat: #efe9dd;
  --reep-neu-shadow: 7px 7px 16px rgba(58, 48, 31, 0.13), -7px -7px 16px rgba(255, 252, 244, 0.92);
  --reep-neu-shadow-lift: 10px 10px 22px rgba(58, 48, 31, 0.16), -10px -10px 22px rgba(255, 253, 247, 1);
  --reep-neu-inset: inset 2px 2px 5px rgba(58, 48, 31, 0.16), inset -2px -2px 5px rgba(255, 252, 244, 0.9);

  --reep-chip-good: #83591b;
  --reep-chip-accent: #83591b;

  --reep-cell-well: #f1ece1;
  --reep-cell-well-hover: #ece5d7;
  --reep-cell-well-inset: inset 1px 1px 2px rgba(58, 48, 31, 0.07), inset -1px -1px 2px rgba(255, 252, 244, 0.7);

  --reep-font-stack: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --reep-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* --- tokens · dark -------------------------------------------------------- */
:root[data-theme='dark'] {
  --reep-primary-main: #f5f1e8;
  --reep-primary-light: #fffdf7;
  --reep-primary-dark: #cdc6b6;
  --reep-primary-contrast: #14120d;

  --reep-secondary-main: #d9a85f;
  --reep-secondary-light: #e8c48c;
  --reep-secondary-dark: #ab7b32;
  --reep-secondary-contrast: #14120d;

  --reep-success-main: #ab7b32;
  --reep-warning-main: #d4a155;
  --reep-error-main: #ead5b6;
  --reep-info-main: #d9a85f;

  --reep-bg-default: #14120d;
  --reep-bg-paper: #1e1a14;

  --reep-text-primary: #f5f1e8;
  --reep-text-secondary: #b0a894;
  --reep-text-disabled: #968d79;

  --reep-divider: rgba(245, 241, 232, 0.12);
  --reep-action-hover: rgba(245, 241, 232, 0.05);
  --reep-action-selected: rgba(217, 168, 95, 0.15);

  --reep-glass-bg: rgba(36, 31, 24, 0.60);
  --reep-glass-solid: #221e17;
  --reep-glass-border: rgba(245, 241, 232, 0.09);
  --reep-glass-shadow: 0 10px 34px rgba(0, 0, 0, 0.48);
  --reep-glass-highlight: inset 0 1px 0 rgba(245, 241, 232, 0.07);

  --reep-neu-bg: linear-gradient(145deg, #241f18, #100e09);
  --reep-neu-flat: #1e1a14;
  --reep-neu-shadow: 7px 7px 16px rgba(0, 0, 0, 0.55), -7px -7px 16px rgba(245, 241, 232, 0.03);
  --reep-neu-shadow-lift: 10px 10px 22px rgba(0, 0, 0, 0.65), -10px -10px 22px rgba(245, 241, 232, 0.042);
  --reep-neu-inset: inset 2px 2px 5px rgba(0, 0, 0, 0.6), inset -2px -2px 5px rgba(245, 241, 232, 0.038);

  --reep-chip-good: #b7802e;
  --reep-chip-accent: #d9a85f;

  --reep-cell-well: #191510;
  --reep-cell-well-hover: #221d15;
  --reep-cell-well-inset: inset 1px 1px 2px rgba(0, 0, 0, 0.5), inset -1px -1px 2px rgba(245, 241, 232, 0.03);
}

/* --- baseline ------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--reep-font-stack);
  font-size: 0.9375rem;
  line-height: 1.6;
  color: var(--reep-text-primary);
  background-color: var(--reep-bg-default);
  -webkit-font-smoothing: antialiased;
}
*:focus-visible {
  outline: 2px solid var(--reep-secondary-main);
  outline-offset: 2px;
  z-index: 1;
}
.tabular { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* type scale */
.reep-h1 { font-size: 1.625rem; font-weight: 600; letter-spacing: -0.021em; line-height: 1.25; }
.reep-h2 { font-size: 1.3125rem; font-weight: 600; letter-spacing: -0.017em; line-height: 1.3; }
.reep-h3 { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.011em; line-height: 1.4; }
.reep-h4 { font-size: 0.9375rem; font-weight: 600; letter-spacing: -0.006em; }
.reep-subtitle1 { font-size: 0.9375rem; font-weight: 500; }
.reep-subtitle2 { font-size: 0.8125rem; font-weight: 500; }
.reep-body1 { font-size: 0.9375rem; line-height: 1.6; }
.reep-body2 { font-size: 0.8125rem; line-height: 1.6; }
.reep-caption { font-size: 0.75rem; line-height: 1.5; }

/* icons — collapse silently if the icon font never arrives */
.mi {
  font-family: 'Material Symbols Outlined';
  font-weight: normal;
  font-style: normal;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  user-select: none;
}
html.no-iconfont .mi { font-size: 0 !important; width: 0; }

/* skip link */
.skip-link {
  position: absolute; left: -9999px; top: 0; z-index: 1400;
  padding: 10px 16px; border-radius: 8px;
  font-size: 0.875rem; font-weight: 500; text-decoration: none;
  background-color: var(--reep-bg-paper); color: var(--reep-text-primary);
  border: 1px solid var(--reep-divider);
}
.skip-link:focus { left: 8px; top: 8px; }

/* --- buttons (global, from the MuiButton theme) -------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 38px; padding: 0 16px;
  font-family: var(--reep-font-stack); font-size: 0.9375rem; font-weight: 500;
  text-decoration: none; border: 1px solid transparent; border-radius: 7px;
  background: transparent; color: var(--reep-text-primary); cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease;
}
.btn:hover { background: var(--reep-action-hover); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn--primary { background: var(--reep-secondary-main); color: var(--reep-secondary-contrast); }
.btn--primary:hover:not(:disabled) { background: var(--reep-secondary-dark); }
.btn--outlined { border-color: var(--reep-divider); }
.btn--small { min-height: 32px; padding: 0 12px; font-size: 0.8125rem; }

/* ==========================================================================
   Kit — ported from shared/kit/kit.components.ts
   ========================================================================== */
.intro {
  display: flex; flex-wrap: wrap; gap: 16px;
  justify-content: space-between; align-items: flex-end; margin-bottom: 40px;
}
.intro__text { min-width: 0; }
.intro__title { margin: 0; color: var(--reep-text-primary); }
.intro__subtitle { margin: 6px 0 0; max-width: 68ch; color: var(--reep-text-secondary); }
.intro__action { flex-shrink: 0; }

.section { margin-bottom: 40px; }
.section__head {
  display: flex; gap: 16px; justify-content: space-between; align-items: baseline;
  padding-bottom: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--reep-divider);
}
.section__headings { min-width: 0; }
.section__title { margin: 0; color: var(--reep-text-primary); }
.section__subtitle { margin: 2px 0 0; color: var(--reep-text-secondary); }
.section__action { flex-shrink: 0; }

.stat { padding: 4px 0; }
.stat__value { font-size: 2rem; font-weight: 600; line-height: 1.05; letter-spacing: -0.028em; }
.stat__label { margin-top: 6px; color: var(--reep-text-secondary); }
.stat__hint { margin-top: 4px; color: var(--reep-text-disabled); }

.empty {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 56px 24px; text-align: center;
}
.empty__title { color: var(--reep-text-secondary); }
.empty__hint { max-width: 48ch; color: var(--reep-text-disabled); }

.banner {
  display: flex; gap: 16px; align-items: center; justify-content: space-between;
  padding: 12px 16px; margin-bottom: 32px;
  border: 1px solid var(--reep-divider); border-radius: 8px;
  background: var(--reep-action-hover);
}
.banner__title { font-size: 0.875rem; font-weight: 600; color: var(--reep-text-primary); margin-bottom: 2px; }
.banner__text { color: var(--reep-text-secondary); }
.banner[data-tone='warning'] .banner__title { color: var(--reep-warning-main); }
.banner[data-tone='critical'] .banner__title { color: var(--reep-error-main); }
.banner[data-tone='good'] .banner__title { color: var(--reep-success-main); }

/* ==========================================================================
   Login — features/login/login.component.scss
   ========================================================================== */
.login { min-height: 100dvh; display: flex; flex-direction: column; }
.brand-strip {
  display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  padding: 16px 24px;
  background-color: var(--reep-primary-main); color: var(--reep-primary-contrast);
}
.brand-strip__name { display: flex; align-items: baseline; gap: 12px; }
.brand-strip__reep { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
.brand-strip__sub { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em; opacity: 0.72; }
.brand-strip__tag { display: none; font-size: 0.75rem; opacity: 0.72; }
.login__row { flex: 1; display: flex; }
.panel {
  display: none; flex-direction: column; justify-content: space-between;
  width: 44%; max-width: 620px; padding: 56px;
  background-color: var(--reep-primary-main); color: var(--reep-primary-contrast);
}
.panel__reep { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; }
.panel__sub { margin-top: 4px; font-size: 0.8125rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.16em; opacity: 0.7; }
.panel__pitch { max-width: 420px; }
.panel__headline { margin: 0; font-size: 2rem; font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
.panel__body { margin: 16px 0 0; font-size: 0.9375rem; line-height: 1.6; opacity: 0.78; }
.panel__foot { font-size: 0.75rem; line-height: 1.5; opacity: 0.55; }
.signin {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 40px 24px; background-color: var(--reep-bg-default);
}
.signin__inner { width: 100%; max-width: 400px; }
.signin__inner .reep-h1 { margin: 0; color: var(--reep-text-primary); }
.signin__subtitle { margin: 4px 0 0; color: var(--reep-text-secondary); }
.form-login { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
.field { position: relative; }
.field__input {
  width: 100%; box-sizing: border-box; min-height: 40px; padding: 8.5px 14px;
  font-family: var(--reep-font-stack); font-size: 0.9375rem;
  color: var(--reep-text-primary); background: transparent;
  border: 1px solid var(--reep-divider); border-radius: 7px; outline: none;
  transition: border-color 120ms ease;
}
.field__input--adorned { padding-right: 44px; }
.field__input:hover { border-color: var(--reep-text-primary); }
.field__input:focus { border-color: var(--reep-primary-main); border-width: 2px; padding: 7.5px 13px; }
.field__input--adorned:focus { padding-right: 43px; }
.field__label {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  padding: 0 4px; font-size: 0.9375rem; color: var(--reep-text-secondary);
  background: var(--reep-bg-default); pointer-events: none;
  transition: top 120ms ease, font-size 120ms ease, color 120ms ease;
}
.field:focus-within .field__label, .field--filled .field__label { top: 0; font-size: 0.75rem; }
.field:focus-within .field__label { color: var(--reep-primary-main); }
.field__adornment {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; padding: 0; border: none; border-radius: 50%;
  background: transparent; color: var(--reep-text-secondary); cursor: pointer;
}
.field__adornment:hover { background: var(--reep-action-hover); }
.alert {
  border-radius: 8px; border: 1px solid var(--reep-divider);
  background-color: var(--reep-action-hover); padding: 10px 14px;
  display: flex; align-items: center;
}
.alert--error { color: var(--reep-error-main); }
.btn--tall { min-height: 46px; margin-top: 4px; width: 100%; }
.btn__icon { margin-right: -2px; }
.spinner {
  width: 16px; height: 16px; border: 2px solid currentColor;
  border-right-color: transparent; border-radius: 50%;
  animation: reep-spin 0.7s linear infinite;
}
@keyframes reep-spin { to { transform: rotate(360deg); } }
.sso { margin-top: 20px; }
.sso__or {
  display: flex; align-items: center; text-align: center;
  color: var(--reep-text-disabled); font-size: 0.75rem; margin-bottom: 14px;
}
.sso__or::before, .sso__or::after { content: ''; flex: 1; height: 1px; background: var(--reep-divider); }
.sso__or span { padding: 0 12px; }
.sso__btn { width: 100%; min-height: 46px; text-decoration: none; }
.demo { margin-top: 32px; background-color: var(--reep-bg-paper); border-radius: 8px; padding: 20px; }
.demo h2 { margin: 0; color: var(--reep-text-primary); }
.demo__hint { margin: 4px 0 0; color: var(--reep-text-secondary); }
.demo__code {
  padding: 2px 6px; border-radius: 4px; background-color: var(--reep-bg-default);
  font-weight: 600; font-family: var(--reep-mono); font-size: 0.85em;
}
.demo__list { margin-top: 12px; display: flex; flex-direction: column; gap: 4px; }
.demo__item {
  display: flex; flex-direction: column; align-items: flex-start; text-align: left;
  padding: 10px 12px; border: none; border-radius: 7px; background: transparent;
  color: var(--reep-text-primary); cursor: pointer; font-family: var(--reep-font-stack);
}
.demo__item:hover { background-color: var(--reep-action-hover); }
.demo__item--chosen, .demo__item--chosen:hover { background-color: var(--reep-action-selected); }
.demo__who { color: var(--reep-text-primary); }
.demo__role { margin-top: 1px; color: var(--reep-text-secondary); font-weight: 400; }
.technote {
  margin: 24px 0 0; padding-top: 16px; border-top: 1px solid var(--reep-divider);
  font-size: 0.75rem; line-height: 1.5; color: var(--reep-text-disabled);
}
.technote code { font-family: var(--reep-mono); font-size: 0.92em; }
@media (min-width: 600px) {
  .brand-strip { padding: 16px 32px; }
  .brand-strip__tag { display: block; }
  .signin { padding: 64px 40px; }
}
@media (min-width: 1200px) {
  .brand-strip { display: none; }
  .panel { display: flex; }
}

/* ==========================================================================
   Shell — layout/app-shell.component.scss (drawer 236, bar 60, lg 1200)
   ========================================================================== */
.shell { min-height: 100vh; background-color: var(--reep-bg-default); }
.appbar {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  display: flex; align-items: center; gap: 8px; padding: 0 16px;
  background-color: var(--reep-bg-default); color: var(--reep-text-primary);
  border-bottom: 1px solid var(--reep-divider); z-index: 20;
}
.appbar__menu-btn, .appbar__icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border: none; border-radius: 50%;
  background: transparent; color: var(--reep-text-disabled); cursor: pointer;
}
.appbar__menu-btn:hover, .appbar__icon-btn:hover { background-color: var(--reep-action-hover); }
.appbar__who { flex: 1; min-width: 0; }
.appbar__name { line-height: 1.3; color: var(--reep-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar__meta { color: var(--reep-text-disabled); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.account { position: relative; }
.account__btn { display: inline-flex; padding: 4px; border: none; background: transparent; border-radius: 50%; cursor: pointer; }
.account__avatar {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border-radius: 50%;
  font-size: 0.75rem; font-weight: 600;
  background-color: var(--reep-action-selected); color: var(--reep-text-primary);
}
.account__backdrop { position: fixed; inset: 0; z-index: 25; }
.account__menu {
  position: absolute; top: calc(100% + 4px); right: 0; min-width: 190px;
  background-color: var(--reep-bg-paper); border: 1px solid var(--reep-divider);
  border-radius: 8px; box-shadow: var(--reep-glass-shadow); z-index: 26; overflow: hidden;
}
.account__header { padding: 10px 16px; }
.account__role { color: var(--reep-text-disabled); }
.account__divider { height: 1px; background-color: var(--reep-divider); }
.account__item {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 16px;
  border: none; background: transparent; color: var(--reep-text-primary);
  font-family: var(--reep-font-stack); font-size: 0.9375rem; cursor: pointer;
}
.account__item:hover { background-color: var(--reep-action-hover); }

.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: 236px;
  display: flex; flex-direction: column;
  background-color: var(--reep-bg-default); border-right: 1px solid var(--reep-divider);
  z-index: 30; transform: translateX(-100%); transition: transform 200ms ease;
  overflow-y: auto;
}
.drawer--open { transform: translateX(0); }
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.32); z-index: 29; }
.drawer__brand { padding: 28px 24px 24px; }
.drawer__reep { font-size: 0.9375rem; font-weight: 600; letter-spacing: 0.02em; line-height: 1; color: var(--reep-text-primary); }
.drawer__role { margin-top: 4px; color: var(--reep-text-disabled); }
.drawer__list { list-style: none; margin: 0; padding: 0 12px; flex: 1; }
.drawer__list li { margin-bottom: 2px; }
.nav__item {
  display: flex; align-items: center; gap: 0; padding: 7px 12px;
  border-radius: 7px; text-decoration: none; color: var(--reep-text-secondary);
}
.nav__item:hover { background-color: var(--reep-action-hover); }
.nav__icon {
  min-width: 32px; color: var(--reep-text-disabled);
  display: inline-flex; align-items: center;
}
.nav__label { font-size: 0.875rem; font-weight: 400; }
.nav__item--active { background-color: var(--reep-action-hover); color: var(--reep-text-primary); }
.nav__item--active .nav__icon { color: var(--reep-secondary-main); }
.nav__item--active .nav__label { font-weight: 600; }
.drawer__foot { padding: 20px 24px; color: var(--reep-text-disabled); }
.content { padding-top: 60px; }
.content__column { padding: 32px 20px 96px; max-width: 1240px; }
@media (min-width: 600px) { .content__column { padding: 40px 32px 104px; } }
@media (min-width: 1200px) {
  .appbar { left: 236px; }
  .appbar__menu-btn { display: none; }
  .drawer { transform: none; transition: none; }
  .drawer-backdrop { display: none; }
  .content { margin-left: 236px; }

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function icon(name, size) { return '<span class="mi" style="font-size:' + (size || 20) + 'px">' + name + '</span>'; }

function pageIntro(title, subtitle, action) {
  return '<div class="intro"><div class="intro__text">' +
    '<h1 class="reep-h1 intro__title">' + esc(title) + '</h1>' +
    (subtitle ? '<p class="reep-body2 intro__subtitle">' + esc(subtitle) + '</p>' : '') +
    '</div><div class="intro__action no-print">' + (action || '') + '</div></div>';
}
function section(title, subtitle, body, action) {
  const head = title
    ? '<div class="section__head"><div class="section__headings">' +
      '<h2 class="reep-h3 section__title">' + esc(title) + '</h2>' +
      (subtitle ? '<p class="reep-caption section__subtitle">' + esc(subtitle) + '</p>' : '') +
      '</div><div class="section__action no-print">' + (action || '') + '</div></div>'
    : '';
  return '<section class="section">' + head + body + '</section>';
}
function stat(label, value, hint, tone) {
  return '<div class="stat">' +
    '<div class="stat__value tabular" style="color:' + (TONE_INK[tone || 'neutral']) + '">' + esc(value) + '</div>' +
    '<div class="reep-body2 stat__label">' + esc(label) + '</div>' +
    (hint ? '<div class="reep-caption stat__hint">' + esc(hint) + '</div>' : '') +
    '</div>';
}
function empty(title, hint, action) {

    (hint ? '<div class="reep-body2 empty__hint">' + esc(hint) + '</div>' : '') +
    '<div class="empty__action">' + (action || '') + '</div></div>';
}
function banner(tone, title, text, action) {
  return '<div class="banner" data-tone="' + esc(tone || 'info') + '"><div class="banner__body">' +

function screenCertifications() {
  const v = DATA.certifications;
  const stage = S.certs.stage;
  const visible = stage === 'ALL' ? v.rows : v.rows.filter((r) => r.stage === stage);
  const counts = {
    required: visible.filter((r) => !r.isOptional).length,
    completed: visible.filter((r) => r.status === 'COMPLETED').length,
    inProgress: visible.filter((r) => r.status === 'IN_PROGRESS').length,
    overdue: visible.filter((r) => r.status === 'OVERDUE').length,
    optional: visible.filter((r) => r.isOptional).length,
  };
  const completedPct = visible.length > 0 ? Math.round((counts.completed / visible.length) * 100) : 0;
  const stageLabel = stage === 'ALL' ? '' : (v.stageLabels[stage] || '');

  let out = pageIntro('Certifications',
    v.requiredTotal === 0
      ? 'No required certifications are mapped to your courses yet.'
      : 'You have finished ' + v.requiredDone + ' of the ' + v.requiredTotal + ' certifications required across REEP.');

  if (v.missingProofCount > 0) {
    out += banner('info', 'Send your certificates to your mentor',
      (v.missingProofCount === 1
        ? 'You have finished a certification but not uploaded the certificate yet.'
        : v.missingProofCount + ' finished certifications have no certificate uploaded yet.') +
      ' Once the file is there your mentor can mark the progress verified.',
      '<a class="btn btn--small" href="#/student/uploads">Go to Uploads</a>');
  }

  out += '<div class="stats">' +
    stat('Required', counts.required, counts.optional > 0 ? 'Plus ' + counts.optional + ' optional, not counted here' : 'Every one listed is mandatory') +
    stat('Completed', counts.completed, visible.length > 0 ? completedPct + '% of the ones shown' : 'Nothing to show yet', 'good') +
    stat('In progress', counts.inProgress, 'Started and keeping up with the plan', 'warning') +
    stat('Overdue', counts.overdue, counts.overdue > 0 ? 'Behind the pace needed to finish in time' : 'Nothing behind pace', 'critical') +
    '</div>';

/* RankedBarChart: horizontal, value-labelled, worst-first — the shape
   shared/charts/bar-chart.component.ts draws through ApexCharts. */
function rankedBarChart(rows, unit) {
  const sorted = rows.slice().sort((a, b) => a.value - b.value);
  const max = Math.max(100, ...sorted.map((r) => r.value));
  return '<div class="rbc">' + sorted.map((r) =>
    '<div class="rbc__row"><div class="rbc__label">' + esc(r.label) + '</div>' +
    '<div class="rbc__track"><div class="rbc__fill" style="width:' + ((r.value / max) * 100) + '%"></div></div>' +
    '<div class="rbc__value tabular">' + esc(r.value + (unit || '')) + '</div></div>').join('') + '</div>';
}

/* --- Time log ---------------------------------------------------------------- */
const DAY_ACTIVITIES = [
  { activity: 'SLEEPING', label: 'Sleeping', hint: 'Including naps' },
  { activity: 'LEISURE', label: 'Engaged in leisure', hint: 'Meals, travel, family, phone, rest — everything that is not the four below' },
  { activity: 'LECTURES', label: 'Engaged in lectures', hint: 'Timetabled classes, seminars, guest sessions' },
  { activity: 'COURSEWORK', label: 'Engaged in coursework', hint: 'Assignments, reading, revision — work your course set you' },
  { activity: 'SKILLING', label: 'Engaged in skilling', hint: 'Excel, Power BI, certifications, mock interviews — work you chose' },
];
const MINUTES_IN_DAY = 1440, STEP_MINUTES = 30;
function emptySheet() { return { SLEEPING: 0, LEISURE: 0, LECTURES: 0, COURSEWORK: 0, SKILLING: 0 }; }
function sheetTotal(s) { return DAY_ACTIVITIES.reduce((sum, d) => sum + (s[d.activity] || 0), 0); }
function durationWords(min) {
  const safe = Math.max(0, Math.round(min)), h = Math.floor(safe / 60), m = safe % 60;
  if (h === 0) return m + ' min';
  if (m === 0) return h + (h === 1 ? ' hour' : ' hours');
  return h + 'h ' + m + 'm';
}
function remainingLabel(s) {
  const r = MINUTES_IN_DAY - sheetTotal(s);
  if (r === 0) return 'The full 24 hours accounted for';
  if (r < 0) return durationWords(-r) + ' over 24';
  return durationWords(r) + ' remaining of 24';
}
function hm(min) {
  const h = Math.floor(min / 60), m = min % 60;
  if (h === 0) return m + 'm';
  if (m === 0) return h + 'h';
  return h + 'h ' + m + 'm';
}
function shiftKey(key, days) {
  const p = key.split('-').map(Number);
  const d = new Date(Date.UTC(p[0], p[1] - 1, p[2] + days));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
}
function screenTimeLog() {
  if (!S.timelog.sheet) S.timelog.sheet = Object.assign(emptySheet(), DATA.timesheet.minutes);
  const sheet = S.timelog.sheet;
  const total = sheetTotal(sheet);
  const over = total > MINUTES_IN_DAY;
  const isToday = S.timelog.day === DATA.timesheet.day;

  const body =
    '<div class="daybar">' +
      '<button type="button" class="btn btn--small btn--outlined" data-act="day" data-val="-1">‹ Previous day</button>' +
      '<div class="daybar__label">' + esc(S.timelog.day) + (isToday ? '<span class="daybar__today reep-caption">today</span>' : '') + '</div>' +
      '<button type="button" class="btn btn--small btn--outlined" data-act="day" data-val="1">Next day ›</button>' +
      '<button type="button" class="btn btn--small" data-act="copy-yesterday">Copy yesterday</button>' +
    '</div>' +
    '<div class="remaining' + (over ? ' remaining--over' : '') + '" aria-live="polite">' + esc(remainingLabel(sheet)) + '</div>' +
    '<div class="bar"><div class="bar__fill' + (over ? ' bar__fill--over' : '') + '" style="width:' + Math.min(100, (total / MINUTES_IN_DAY) * 100) + '%"></div></div>' +
    '<div class="buckets">' + DAY_ACTIVITIES.map((d) =>
      '<div class="bucket"><div class="bucket__head">' +
      '<div class="bucket__label">' + esc(d.label) + '</div>' +
      '<div class="bucket__hint reep-caption">' + esc(d.hint) + '</div></div>' +
      '<div class="stepper">' +
      '<button type="button" class="stepper__btn" data-act="step" data-a="' + d.activity + '" data-val="-1" aria-label="Less ' + esc(d.label) + '">−</button>' +
      '<div class="stepper__value tabular">' + hm(sheet[d.activity] || 0) + '</div>' +
      '<button type="button" class="stepper__btn" data-act="step" data-a="' + d.activity + '" data-val="1" aria-label="More ' + esc(d.label) + '">+</button>' +
      '</div></div>').join('') + '</div>' +
    '<div class="actions">' +
      '<button type="button" class="btn btn--primary" data-act="save-day"' + (over ? ' disabled' : '') + '>Save day</button>' +
      (S.timelog.saved ? '<span class="saved reep-caption">Saved</span>' : '') +
      (over ? '<span class="err reep-caption">Over 24 hours — take some off before saving.</span>' : '') +
    '</div>' +
    '<p class="reep-caption note">These five are separate from the course-linked session log — this one answers "where did the whole day go?", including sleep and rest.</p>';

  return pageIntro('Time sheet', 'Where the day went, in five buckets. Estimate in half-hours — it should take under a minute.') +
    section(null, null, body);
}

      area('Bond details', 'bondDetails') +
      area('Other benefits', 'otherBenefits') +
      (o.error ? '<p class="err reep-caption">' + esc(o.error) + '</p>' : '') +
      '<div class="actions">' +
      '<button type="button" class="btn btn--outlined" data-act="offer-save" data-val="draft">Save draft</button>' +
      '<button type="button" class="btn btn--primary" data-act="offer-save" data-val="submit">Save &amp; submit</button>' +
      '<button type="button" class="btn" data-act="offer-close">Cancel</button>' +
      '</div></div>';
    out += section('New offer', 'Once you submit, this cannot be edited — so a placement report never reads a figure that changed after approval.', formBody);
  }

  if (o.list.length === 0) {
    out += empty('No offers recorded yet.', 'When you receive an offer, add it here so the placement office has it on record.');
  } else {
    const body = '<div class="offers">' + o.list.map((x) =>
      '<div class="offer"><div class="offer__head"><div>' +
      '<div class="offer__title">' + esc(x.jobTitle) + '</div>' +
      '<div class="offer__org reep-caption">' + esc(x.organisation + ' · ' + (OFFER_ROLE_LABEL[x.roleType] || x.roleType) + ' · ' + x.channel) + '</div></div>' +
      '<span class="badge" data-status="' + esc(x.status) + '">' + esc(OFFER_STATUS_LABEL[x.status] || x.status) + '</span></div>' +
      '<div class="offer__facts"><span><strong class="tabular">' + esc(lpa(x.ctcInr)) + '</strong> CTC</span>' +
      (x.fixedGrossInr > 0 ? '<span class="tabular">' + esc(lpa(x.fixedGrossInr)) + ' fixed</span>' : '') +
      (x.location ? '<span>' + esc(x.location) + '</span>' : '') +
      '<span>' + esc(x.workMode) + '</span></div>' +
      (x.decisionNote ? '<div class="offer__note reep-caption">' + esc(x.decisionNote) + '</div>' : '') +
      (x.status === 'DRAFT'
        ? '<div class="offer__actions"><button type="button" class="btn btn--small btn--primary" data-act="offer-submit" data-id="' + esc(x.id) + '">Submit for approval</button></div>'
        : '') +
      '</div>').join('') + '</div>';
    out += section(o.list.length + (o.list.length === 1 ? ' offer' : ' offers'), null, body);
  }
  return out;
}

/* ==========================================================================
   Shell
   ========================================================================== */
function shellRole(role) {
  if (role === 'STUDENT') return 'student';
  if (role === 'MENTOR') return 'mentor';
  return 'director';
}
function initials(name) {
  return name.replace(/^(Prof\.|Dr\.|Mr\.|Ms\.)\s*/i, '').split(' ')
    .map((p) => p[0]).filter(Boolean).slice(0, 2).join('').toUpperCase();
}
function isActive(href, exact) {
  return exact ? S.route === href : (S.route === href || S.route.indexOf(href + '/') === 0);
}
function renderShell() {
  const role = shellRole(S.session.role);
  const roleLabel = ROLE_LABEL[role];
  const items = NAV[role];
  const meta = S.session.role === 'STUDENT'
    ? 'USN ' + DATA.meta.usn + ' · ' + DATA.meta.stageLabel + ' · Semester ' + DATA.meta.currentSemester
    : null;

  const route = ROUTES[S.route];
  let content, screenKey;
  if (!route) { screenKey = 'placeholder'; content = screenPlaceholder('Being migrated'); }
  else {
    screenKey = route.screen;
    switch (route.screen) {
      case 'overview': content = screenOverview(); break;
      case 'jobs': content = screenJobs(); break;
      case 'certifications': content = screenCertifications(); break;
      case 'leaderboards': content = screenLeaderboards(); break;
      case 'time-log': content = screenTimeLog(); break;
      case 'academics': content = screenAcademics(); break;
      case 'profile': content = screenProfile(); break;
      case 'offers': content = screenOffers(); break;
      default: content = screenPlaceholder(route.title);
    }
  }

  return '<div class="shell">' +
    '<a href="#' + S.route + '" class="skip-link no-print" data-act="skip">Skip to content</a>' +
    '<header class="appbar no-print">' +
      '<button type="button" class="appbar__menu-btn" aria-label="Open navigation" data-act="drawer-open">' + icon('menu', 22) + '</button>' +
      '<div class="appbar__who"><div class="appbar__name reep-subtitle2">' + esc(S.session.name) + '</div>' +
        (meta ? '<div class="appbar__meta reep-caption">' + esc(meta) + '</div>' : '') + '</div>' +
      '<button type="button" class="appbar__icon-btn" aria-label="' + (isDark() ? 'Light mode' : 'Dark mode') + '" data-act="theme">' +
        icon(isDark() ? 'light_mode' : 'dark_mode', 19) + '</button>' +
      '<div class="account">' +
        '<button type="button" class="account__btn" aria-label="' + esc(initials(S.session.name)) + ', account menu" data-act="menu">' +
        '<span class="account__avatar">' + esc(initials(S.session.name)) + '</span></button>' +
        (S.menuOpen
          ? '<div class="account__backdrop" data-act="menu-close"></div>' +
            '<div class="account__menu" role="menu">' +
            '<div class="account__header"><div class="reep-subtitle2">' + esc(S.session.name) + '</div>' +
            '<div class="reep-caption account__role">' + esc(roleLabel) + '</div></div>' +
            '<div class="account__divider"></div>' +
            '<button type="button" class="account__item" role="menuitem" data-act="signout">' + icon('logout', 18) + '<span>Sign out</span></button></div>'
          : '') +
      '</div>' +
    '</header>' +
    (S.mobileOpen ? '<div class="drawer-backdrop no-print" data-act="drawer-close"></div>' : '') +
    '<nav class="drawer no-print' + (S.mobileOpen ? ' drawer--open' : '') + '" aria-label="' + esc(roleLabel) + ' sections">' +
      '<div class="drawer__brand"><div class="drawer__reep">REEP</div>' +
      '<div class="drawer__role reep-caption">' + esc(roleLabel) + '</div></div>' +
      '<ul class="drawer__list">' + items.map((it) =>
        '<li><a class="nav__item' + (isActive(it.href, it.exact) ? ' nav__item--active' : '') + '" href="#' + it.href + '" data-act="nav">' +
        '<span class="nav__icon">' + icon(it.icon, 19) + '</span>' +
        '<span class="nav__label">' + esc(it.label) + '</span></a></li>').join('') + '</ul>' +
      '<div class="drawer__foot reep-caption">BGSCET MBA</div>' +

    '<main id="main" tabindex="-1" class="content"><div class="content__column" data-screen="' + screenKey + '">' + content + '</div></main>' +

/* ==========================================================================
   Router + render
   ========================================================================== */
function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

function normalise(hash) {
  let path = (hash || '').replace(/^#/, '');
  if (!path) return S.session ? HOME_FOR_ROLE[S.session.role] : '/login';
  if (path === '/login') return '/login';
  // Unknown paths fall through the wildcard to '' → the role home, exactly as
  // app.routes.ts does with { path: '**', redirectTo: '' }.
  if (!ROUTES[path]) return S.session ? HOME_FOR_ROLE[S.session.role] : '/login';
  return path;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = (S.session ? renderShell() : renderLogin()) +
    '<div class="proto-note no-print"><span>Prototype · no backend</span>' +
    (S.session ? '<button type="button" data-act="signout">sign out</button>' : '') + '</div>';
}

function go(path) {
  if (location.hash !== '#' + path) location.hash = path;
  else { S.route = path; render(); }
}

window.addEventListener('hashchange', () => {
  const next = normalise(location.hash);
  if (('#' + next) !== location.hash) { location.hash = next; return; }
  S.route = next;
  S.mobileOpen = false;
  S.menuOpen = false;
  render();
  const main = document.getElementById('main');
  if (main) main.focus();
});

/* ==========================================================================
   Events — one delegated listener, the way the components' own handlers map
   ========================================================================== */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  const val = el.getAttribute('data-val');
  const id = el.getAttribute('data-id');
  const i = Number(el.getAttribute('data-i'));

  // links handled by the router
  if (act === 'nav') { S.mobileOpen = false; return; }
  if (act === 'skip') { ev.preventDefault(); const m = document.getElementById('main'); if (m) m.focus(); return; }

  switch (act) {
    case 'demo': {
      const a = DEMO_ACCOUNTS.find((x) => x.email === val);
      S.login.email = a.email; S.login.password = DEMO_PASSWORD; S.login.showPassword = false; S.login.error = null;
      render(); return;
    }
    case 'toggle-password': S.login.showPassword = !S.login.showPassword; render(); return;
    case 'sso':
      S.login.error = 'Google sign-in is inert until GOOGLE_CLIENT_ID and SECRET are set on the API.';
      render(); return;
    case 'theme': {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('reep-theme', next); } catch (e) {}
      render(); return;
    }
    case 'menu': S.menuOpen = !S.menuOpen; render(); return;
    case 'menu-close': S.menuOpen = false; render(); return;
    case 'drawer-open': S.mobileOpen = true; render(); return;
    case 'drawer-close': S.mobileOpen = false; render(); return;
    case 'signout': S.session = null; S.menuOpen = false; go('/login'); render(); return;

    case 'jobs-level': S.jobs.level = val; render(); return;
    case 'jobs-elig': S.jobs.eligFilter = val; render(); return;
    case 'jobs-apply': {
      const row = jobsRows().find((r) => r.id === id);
      if (row && row.applyUrl) window.open(row.applyUrl, '_blank', 'noopener,noreferrer');
      if (row && !row.openedLabel && !row.applied) row.openedLabel = 'Opened just now';
      render(); return;
    }
    case 'cert-stage': S.certs.stage = val; render(); return;
    case 'board': S.boards.activeKey = val; render(); return;

    case 'day': S.timelog.day = shiftKey(S.timelog.day, Number(val)); S.timelog.saved = false; render(); return;
    case 'copy-yesterday': S.timelog.saved = false; render(); return;
    case 'step': {
      const a = el.getAttribute('data-a');
      const dir = Number(val);
      const cur = S.timelog.sheet[a] || 0;
      const next = dir === 1
        ? Math.floor(cur / STEP_MINUTES) * STEP_MINUTES + STEP_MINUTES
        : Math.ceil(cur / STEP_MINUTES) * STEP_MINUTES - STEP_MINUTES;
      S.timelog.sheet[a] = Math.min(MINUTES_IN_DAY, Math.max(0, next));
      S.timelog.saved = false; render(); return;
    }
    case 'save-day': S.timelog.saved = true; render(); return;

    case 'qual-add':
      S.academics.qualifications.push({ level: val, institution: '', board: '', year: new Date().getFullYear(), marks: 0, maxMarks: 100, medium: '', location: '', subjects: '' });
      render(); return;
    case 'qual-remove': S.academics.qualifications.splice(i, 1); render(); return;
    case 'save-academics': S.academicsSaved = true; render(); return;

    case 'save-contact': S.profileFlags.contactSaved = true; render(); return;
    case 'save-target': S.profileFlags.targetSaved = true; render(); return;
    case 'toggle-optout':
      S.profile.leaderboardOptOut = el.checked;
      S.profileFlags.optOutSaved = true;
      DATA.leaderboards.viewerOptedOut = el.checked;
      render(); return;

    case 'offer-open': S.offers.formOpen = true; S.offers.form = blankOffer(); S.offers.error = null; render(); return;
    case 'offer-close': S.offers.formOpen = false; S.offers.error = null; render(); return;
    case 'bonus-add': S.offers.form.bonuses.push({ label: '', amountInr: 0 }); render(); return;
    case 'bonus-remove': S.offers.form.bonuses.splice(i, 1); render(); return;
    case 'offer-save': {
      const f = S.offers.form;
      if (!String(f.jobTitle).trim() || !String(f.organisation).trim()) {
        S.offers.error = 'A job title and organisation are required.'; render(); return;
      }
      S.offers.list.unshift(Object.assign({}, f, {
        id: 'local-' + S.offers.list.length,
        ctcInr: Number(f.ctcInr) || 0,
        fixedGrossInr: Number(f.fixedGrossInr) || 0,
        status: val === 'submit' ? 'PENDING_APPROVAL' : 'DRAFT',
        decisionNote: null,
      }));
      S.offers.formOpen = false; S.offers.error = null; render(); return;
    }
    case 'offer-submit': {
      const x = S.offers.list.find((y) => y.id === id);
      if (x) x.status = 'PENDING_APPROVAL';
      render(); return;
    }
  }
});

/* checkbox / input state changes */
document.addEventListener('change', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  if (act === 'jobs-tick') {
    const row = jobsRows().find((r) => r.id === el.getAttribute('data-id'));
    if (row) row.applied = el.checked;
    render();
  }
});

/* text inputs — kept out of render() so the caret does not jump */
document.addEventListener('input', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  const k = el.getAttribute('data-k');
  const i = Number(el.getAttribute('data-i'));
  if (act === 'login-edit') { S.login[k] = el.value; }
  else if (act === 'profile-edit') { S.profile[k] = el.value; S.profileFlags.contactSaved = false; S.profileFlags.targetSaved = false; }
  else if (act === 'qual-edit') { S.academics.qualifications[i][k] = el.value; S.academicsSaved = false; }
  else if (act === 'gap-edit') { S.academics.gap[k] = Number(el.value) || 0; S.academicsSaved = false; }
  else if (act === 'offer-edit') { S.offers.form[k] = el.value; }
  else if (act === 'bonus-edit') { S.offers.form.bonuses[i][k] = el.value; }
});

/* select changes need the same treatment */
document.addEventListener('change', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.tagName !== 'SELECT') return;
  if (el.getAttribute('data-act') === 'offer-edit') S.offers.form[el.getAttribute('data-k')] = el.value;
});

/* login */
document.addEventListener('submit', (ev) => {
  const form = ev.target.closest('[data-act="login-submit"]');
  if (!form) return;
  ev.preventDefault();
  const L = S.login;
  if (!L.email || !L.password) { L.error = 'Enter both your email and password.'; render(); return; }
  const account = DEMO_ACCOUNTS.find((a) => a.email === L.email.trim().toLowerCase());
  if (!account || L.password !== DEMO_PASSWORD) {
    L.error = 'Those credentials do not match an account.'; render(); return;
  }
  L.pending = true; render();
  setTimeout(() => {
    L.pending = false; L.error = null;
    S.session = { name: account.who, role: account.roleKey, email: account.email };
    go(HOME_FOR_ROLE[account.roleKey]);
    render();
  }, 420);
});

/* ==========================================================================
   Boot
   ========================================================================== */
(function boot() {
  try {
    const saved = localStorage.getItem('reep-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}

  // If the Material Symbols font never arrives (offline), collapse the icons
  // rather than letting "workspace_premium" show as raw text in the sidebar.
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      if (!document.fonts.check('24px "Material Symbols Outlined"')) {
        document.documentElement.classList.add('no-iconfont');
        render();
      }
    }).catch(() => {});
  }

  S.route = normalise(location.hash);
  if (('#' + S.route) !== location.hash) location.hash = S.route;
  render();
})();
</script>
