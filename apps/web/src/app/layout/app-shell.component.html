<div class="v2-stage">
  <div class="desktop-frame">
    <div class="desktop-titlebar">
      <span class="icon" style="font-size:14px">school</span>
      REEP — {{ roleLabel() }}
      <button type="button" class="titlebar-logout" (click)="signOut()">
        <span class="icon" style="font-size:14px">logout</span>
        Sign out
      </button>
    </div>

    <div class="desktop-shell">
      <nav class="desktop-nav">
        <div class="brand">REEP</div>

        <a routerLink="/student" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          <span class="icon">home</span> Landing
        </a>
        <a routerLink="/student/jobs" routerLinkActive="active">
          <span class="icon">work</span> Jobs
        </a>
        <a routerLink="/student/skilling" routerLinkActive="active">
          <span class="icon">verified</span> Skilling
        </a>
        <a routerLink="/student/leaderboards" routerLinkActive="active">
          <span class="icon">leaderboard</span> Leaderboards
        </a>
        <a routerLink="/student/time-log" routerLinkActive="active">
          <span class="icon">schedule</span> Time Sheet
        </a>

        <div class="sec-label">Programme</div>
        <a routerLink="/student/certifications" routerLinkActive="active">
          <span class="icon">workspace_premium</span> Certifications
        </a>
        <a routerLink="/student/courses" routerLinkActive="active">
          <span class="icon">menu_book</span> Courses
        </a>

        <div class="sec-label">Documents</div>
        <a routerLink="/student/uploads" routerLinkActive="active">
          <span class="icon">upload_file</span> Uploads
        </a>
        <a routerLink="/student/resume" routerLinkActive="active">
          <span class="icon">description</span> Resume Builder
        </a>

        <div class="sec-label">More</div>
        <a routerLink="/student/assistant" routerLinkActive="active">
          <span class="icon">smart_toy</span> REEP Agent
        </a>
        <a routerLink="/student/profile" routerLinkActive="active">
          <span class="icon">person</span> Profile
        </a>
      </nav>

      <main class="desktop-main">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
